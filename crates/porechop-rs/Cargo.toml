[package]
name = "porechop-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Adapter trimming and barcode demultiplexing for Nanopore reads (Porechop drop-in)"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
flate2 = "1.1.11"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.1"

[build-dependencies]
cc = "1.11.3"
